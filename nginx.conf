events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

stream {
    # === LOGGING ===
    log_format minecraft '$remote_addr [$time_local] '
                         '$status $upstream_addr '
                         'sent: $bytes_sent recv: $bytes_received '
                         'session: $session_time';

    access_log /var/log/nginx/minecraft_access.log minecraft;
    error_log  /var/log/nginx/minecraft_error.log warn;

    # === BACKEND ===
    upstream minecraft {
        server mc:25565 max_fails=3 fail_timeout=30s;
    }

    # === SERVER ===
    server {
        listen 25565 reuseport;
        listen [::]:25565 reuseport;

        # === IP WHITELIST ===
        allow 192.168.1.36;
        deny all;

        # === PROXY SETTINGS (ONLY VALID IN STREAM) ===
        proxy_pass minecraft;
        proxy_timeout 1m;
        proxy_connect_timeout 10s;
        proxy_socket_keepalive on; 
    }
}
